name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from public distributions
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Test public API and lifecycle contracts
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Compile maintained entry points
        run: python -m compileall -q main.py handoff.py context_store.py runtime.py run_receipt.py resource_records.py resource_target.py local_output.py cleanup_run.py webhook examples tests
      - name: Validate launcher syntax
        run: bash -n run.sh
