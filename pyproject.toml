[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "blaxel-openai-agents-api-cookbook"
version = "0.1.0"
description = "Give OpenAI-hosted agents an isolated Blaxel computer with optional file handoff"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "openai>=3.13.0,<4",
  "blaxel>=0.4.7,<0.5",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.118,<1",
  "httpx>=0.27,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.15.15,<0.16",
]

[tool.setuptools]
py-modules = [
  "cleanup_run",
  "context_store",
  "handoff",
  "local_output",
  "main",
  "resource_records",
  "resource_target",
  "run_receipt",
  "runtime",
]
packages = ["webhook"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
